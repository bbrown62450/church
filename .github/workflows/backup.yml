# Daily encrypted backup of the Supabase `public` schema (ops slice, S2).
# The dump is piped through `age` to the public keys in
# .github/backup/age-recipients.txt, so no plaintext dump ever touches the
# runner's disk, and only the owner's private key can open the artifact.
# BACKUP_DATABASE_URL is a secret of the `backup` environment, which only
# `main` may use. .github/backup/pg_env.py masks every part of the URL, then
# hands the parts to libpq as PG* variables, so psql and pg_dump never get a
# URL they could quote back into this public log.
# Key custody, key rotation and the restore drill: docs/ops-runbook.md → Backups.
name: db-backup
on:
  schedule:
    - cron: "37 8 * * *"   # daily at 08:37 UTC
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: db-backup
  cancel-in-progress: false
jobs:
  dump:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: backup       # holds BACKUP_DATABASE_URL; deployment branches: main only
    env:
      PG_MAJOR: "17"          # MUST equal "- Postgres server major:" in docs/ops-runbook.md → Platform limits; the job checks the server
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Check prerequisites
        env:
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
        run: |
          test -n "$BACKUP_DATABASE_URL" || { echo "::error::BACKUP_DATABASE_URL secret is not set"; exit 1; }
          grep -Eq '^age1[02-9ac-hj-np-z]{58}$' .github/backup/age-recipients.txt \
            || { echo "::error::.github/backup/age-recipients.txt has no age recipient"; exit 1; }
      - name: Install PostgreSQL client and age
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common age
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y "postgresql-client-${PG_MAJOR}"
      - name: Dump, compress and encrypt (plaintext never touches disk)
        env:
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          PGSSLMODE: require
        run: |
          set -euo pipefail
          python3 .github/backup/pg_env.py --mask <<<"$BACKUP_DATABASE_URL"
          # The masks are registered; now hand libpq the parts, not the URL.
          pg_env=$(python3 .github/backup/pg_env.py --exports <<<"$BACKUP_DATABASE_URL")
          eval "$pg_env"
          unset pg_env BACKUP_DATABASE_URL
          bin="/usr/lib/postgresql/${PG_MAJOR}/bin"
          server=$("$bin/psql" -X -Atc 'show server_version_num')
          major=$(( server / 10000 ))
          [ "$major" = "$PG_MAJOR" ] || { echo "::error::Postgres server major is $major but PG_MAJOR is $PG_MAJOR; update PG_MAJOR in backup.yml"; exit 1; }
          ts=$(date -u +%Y%m%dT%H%M%SZ)
          "$bin/pg_dump" --schema=public --no-owner --no-privileges --format=custom \
            | age --encrypt --recipients-file .github/backup/age-recipients.txt --output "backup-$ts.dump.age"
          size=$(stat -c %s "backup-$ts.dump.age")
          [ "$size" -gt 1024 ] || { echo "::error::Encrypted backup is unexpectedly small ($size bytes)"; exit 1; }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: db-backup
          path: backup-*.dump.age
          retention-days: 30
          if-no-files-found: error
          compression-level: 0
